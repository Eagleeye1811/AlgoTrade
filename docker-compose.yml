services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algotrade
      POSTGRES_USER: algotrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotrade}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrade -d algotrade"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      ALGOTRADE_DATABASE_URL: postgresql+asyncpg://algotrade:${POSTGRES_PASSWORD:-algotrade}@postgres:5432/algotrade
      ALGOTRADE_REDIS_URL: redis://redis:6379/0
      ALGOTRADE_JWT_SECRET: ${ALGOTRADE_JWT_SECRET:?set ALGOTRADE_JWT_SECRET in .env}
      ALGOTRADE_O21_USERNAME: ${ALGOTRADE_O21_USERNAME:?set ALGOTRADE_O21_USERNAME in .env}
      ALGOTRADE_O21_PASSWORD: ${ALGOTRADE_O21_PASSWORD:?set ALGOTRADE_O21_PASSWORD in .env}
      ALGOTRADE_CORS_ORIGINS: http://localhost:8080
      ALGOTRADE_TELEGRAM_BOT_TOKEN: ${ALGOTRADE_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
